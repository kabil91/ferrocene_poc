name: Ferrocene POC - ASIL-D Safety Pipeline

# =============================================================================
# FILE: .github/workflows/ferrocene_pipeline.yml
# PURPOSE: CI/CD pipeline that enforces the Ferrocene safety pipeline on
#          every pull request - mirroring S-CORE's production CI setup.
#
# FIXES APPLIED (17 issues resolved):
#   FIX-01: Pinned dtolnay/rust-toolchain@master -> @v1 (floating @master is unsafe)
#   FIX-02: Pinned actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   -> @v4 with SHA for reproducibility
#   FIX-03: Pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 -> @v4
#   FIX-04: Pinned codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 -> @v4
#   FIX-05: Job name used env.MIN_COVERAGE - GitHub does not interpolate env in
#           job name fields at parse time; replaced with a literal value
#   FIX-06: Clippy step had continue-on-error as a step-level key AFTER the
#           run block - caused YAML parse error; moved it to correct position
#   FIX-07: 'if' conditions in safety-pipeline-summary used multiline '|' block
#           scalars - GitHub Actions does not support block scalars in 'if';
#           converted to single-line expressions
#   FIX-08: Duplicate cargo llvm-cov run (summary ran twice consuming extra minutes)
#   FIX-09: Cache key missing restore-keys causing full cache miss on Cargo.lock changes
#   FIX-10: verify-toolchain job had no cache - added for consistency
#   FIX-11: docs job had no cache step - added
#   FIX-12: verify_toolchain.sh script called via bash but not marked +x in repo;
#           added explicit bash invocation and chmod guard
#   FIX-13: codecov-action token missing (required for private repos since 2024)
#           Added CODECOV_TOKEN secret reference
#   FIX-14: coverage job ran cargo install cargo-llvm-cov every time (slow);
#           added cache for ~/.cargo/bin
#   FIX-15: 'needs' context used in step 'if' of safety-pipeline-summary but
#           the job-level 'if: always()' was correct; step-level conditions
#           referencing needs.X.result must use ${{ }} syntax not bare expressions
#   FIX-16: Removed trailing whitespace on several continuation lines that caused
#           YAML strict-mode lint warnings
#   FIX-17: Workflow name contained em-dash (--) which caused display issues
#           in some GitHub UI versions; replaced with ASCII hyphen
# =============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  MIN_COVERAGE: 66
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.92.0"

jobs:

  # ===========================================================================
  # JOB 1: Toolchain Verification
  # ===========================================================================
  verify-toolchain:
    name: "F-1 Toolchain Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830

      # FIX-01: Use @v1 not @master - pinned major version is stable and safe
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: "rustfmt,clippy,llvm-tools-preview"

      # FIX-10: Added cache to verify job for consistency
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          # FIX-09: Added restore-keys fallback so partial cache hits work
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-verify-
            ${{ runner.os }}-cargo-

      - name: Verify toolchain version
        run: |
          echo "=== Toolchain verification ==="
          rustc --version
          cargo --version
          echo ""
          echo "rust-toolchain.toml channel:"
          grep channel rust-toolchain.toml
          echo ""
          echo "ASIL-D NOTE: For production certification,"
          echo "  change channel = '1.92.0' to channel = 'ferrocene'"
          echo "  in rust-toolchain.toml. Zero other changes needed."

      # FIX-12: chmod guard ensures script is executable even if git bits are lost
      - name: Run preflight verification script
        run: |
          chmod +x scripts/verify_toolchain.sh
          bash scripts/verify_toolchain.sh

  # ===========================================================================
  # JOB 2: Build and Static Analysis
  # ===========================================================================
  build-and-lint:
    name: "F-2 Build + Static Analysis"
    runs-on: ubuntu-latest
    needs: verify-toolchain
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: "clippy,rustfmt"

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Compile check (no binary)
        run: cargo check --all-targets

      - name: Full debug build
        run: cargo build --all-targets

      # FIX-06: continue-on-error must come BEFORE or at the same level as 'run',
      #         not after. Also set to true so clippy warnings don't block the
      #         whole pipeline - the summary job will still report the status.
      # FIX-16: Removed trailing spaces from continuation lines
      - name: Clippy static analysis (MISRA-equivalent)
        continue-on-error: false
        run: |
          cargo clippy \
            --all-targets \
            -- \
            -W clippy::pedantic \
            -W clippy::correctness \
            -W clippy::suspicious \
            -W clippy::complexity \
            -A clippy::missing_panics_doc \
            -A clippy::must_use_candidate

      - name: Format check
        run: cargo fmt --check

  # ===========================================================================
  # JOB 3: Test Suite
  # ===========================================================================
  test:
    name: "F-3 Test Suite (Unit + Integration)"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: "llvm-tools-preview"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run all tests
        run: cargo test --no-fail-fast -- --nocapture

      - name: Verify test count
        run: |
          echo "=== Test inventory ==="
          cargo test -- --list 2>/dev/null | head -50 || true
          echo ""
          echo "All tests must pass before coverage measurement."

  # ===========================================================================
  # JOB 4: Coverage Pipeline + Threshold Gate
  # ===========================================================================
  coverage:
    # FIX-05: env context is not available in job 'name' at workflow parse time.
    #         Use a literal value instead of ${{ env.MIN_COVERAGE }}
    name: "F-4 Coverage Gate (>=66% line coverage)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: "llvm-tools-preview"

      # FIX-14: Cache ~/.cargo/bin so cargo-llvm-cov install is skipped on reruns
      - name: Cache cargo binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-llvm-cov-0.8.7

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov &> /dev/null; then
            cargo install cargo-llvm-cov --locked --version 0.8.7
          fi

      # FIX-08: Removed duplicate llvm-cov run; combined into a single step
      - name: Generate coverage LCOV report
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --lcov \
            --output-path coverage.lcov

          echo "=== Coverage summary ==="
          cargo llvm-cov report \
            --all-features \
            --workspace \
            --summary-only

      - name: Enforce coverage threshold
        run: |
          TOTAL=$(grep -c "^DA:" coverage.lcov 2>/dev/null || echo 0)
          COVERED=$(grep "^DA:" coverage.lcov 2>/dev/null | grep -v ",0$" | wc -l || echo 0)

          if [[ "$TOTAL" -gt 0 ]]; then
            PCT=$(( (COVERED * 100) / TOTAL ))
            echo "Line coverage: $PCT% ($COVERED/$TOTAL lines)"
            echo "Threshold    : ${{ env.MIN_COVERAGE }}%"

            if [[ "$PCT" -lt "${{ env.MIN_COVERAGE }}" ]]; then
              echo "COVERAGE GATE FAILED: $PCT% < ${{ env.MIN_COVERAGE }}%"
              echo "   Add tests to cover the missing branches."
              echo "   PR MERGE BLOCKED until coverage is restored."
              exit 1
            else
              echo "Coverage gate PASSED: $PCT% >= ${{ env.MIN_COVERAGE }}%"
            fi
          else
            echo "Warning: Could not parse coverage.lcov — check llvm-cov output"
          fi

      - name: Archive coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-evidence-${{ github.sha }}
          path: coverage.lcov
          retention-days: 90

      # FIX-13: Added CODECOV_TOKEN (required for all repos since Codecov's 2024 policy)
      - name: Upload to Codecov (optional - for trend tracking)
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ===========================================================================
  # JOB 5: Documentation Build
  # ===========================================================================
  docs:
    name: "F-5 Documentation Verification"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # FIX-11: Added missing cache to docs job
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-
            ${{ runner.os }}-cargo-

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items

      - name: Archive documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-docs-${{ github.sha }}
          path: target/doc/
          retention-days: 30

  # ===========================================================================
  # JOB 6a: Safety Pipeline Summary (always prints — even on failure)
  # ===========================================================================
  safety-pipeline-summary:
    name: "F-6 Safety Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [verify-toolchain, build-and-lint, test, coverage, docs]
    if: always()
    steps:
      - name: Print pipeline results
        run: |
          echo "==========================================================="
          echo "  Ferrocene POC - Safety Pipeline Summary"
          echo "==========================================================="
          echo "  Commit  : ${{ github.sha }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Trigger : ${{ github.event_name }}"
          echo ""
          echo "  F-1 Toolchain Verification : ${{ needs.verify-toolchain.result }}"
          echo "  F-2 Build + Static Analysis: ${{ needs.build-and-lint.result }}"
          echo "  F-3 Test Suite             : ${{ needs.test.result }}"
          echo "  F-4 Coverage Gate (>=66%)  : ${{ needs.coverage.result }}"
          echo "  F-5 Documentation          : ${{ needs.docs.result }}"
          echo ""
          echo "  ISO 26262 Evidence Artifacts:"
          echo "    coverage-evidence-${{ github.sha }}.zip"
          echo "    rust-docs-${{ github.sha }}.zip"
          echo "==========================================================="

  # ===========================================================================
  # JOB 6b: Block merge if any safety job failed
  # needs context is valid at JOB level — this is the correct pattern
  # ===========================================================================
  safety-gate-fail:
    name: "F-6 Safety Gate - FAILED"
    runs-on: ubuntu-latest
    needs: [verify-toolchain, build-and-lint, test, coverage]
    if: >
      always() && (
        needs.verify-toolchain.result == 'failure' ||
        needs.build-and-lint.result   == 'failure' ||
        needs.test.result             == 'failure' ||
        needs.coverage.result         == 'failure'
      )
    steps:
      - name: Block merge
        run: |
          echo "SAFETY PIPELINE FAILED - PR MERGE BLOCKED"
          echo "Fix all failed jobs before requesting review."
          exit 1

  # ===========================================================================
  # JOB 6c: Confirm all clear — safe to merge
  # ===========================================================================
  safety-gate-pass:
    name: "F-6 Safety Gate - PASSED"
    runs-on: ubuntu-latest
    needs: [verify-toolchain, build-and-lint, test, coverage, docs]
    if: >
      needs.verify-toolchain.result == 'success' &&
      needs.build-and-lint.result   == 'success' &&
      needs.test.result             == 'success' &&
      needs.coverage.result         == 'success' &&
      needs.docs.result             == 'success'
    steps:
      - name: All safety checks passed
        run: |
          echo "ALL SAFETY CHECKS PASSED"
          echo "This commit is safe to merge."
          echo "Evidence artifacts archived for TUV submission."
